services:
  db:
    image: mysql:8.0
    container_name: attendance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass2026!
      MYSQL_DATABASE: attendance_db
      MYSQL_USER: att_user
      MYSQL_PASSWORD: StrongP@ssw0rd2026
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: attendance_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: att_user
      PMA_PASSWORD: StrongP@ssw0rd2026
    networks:
      - frontend_net
      - backend_net

  app:
    build: ./app
    container_name: attendance_app
    restart: always
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}"
    environment:
      DB_HOST: db
      DB_USER: att_user
      DB_PASSWORD: StrongP@ssw0rd2026
      DB_NAME: attendance_db
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db
  nginx:
    image: nginx:alpine
    container_name: attendance_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: attendance_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend_net
      - frontend_net

  grafana:
    image: grafana/grafana:10.0.0
    container_name: attendance_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=AdminStrongPass2026!
    networks:
      - frontend_net
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.8.4
    container_name: attendance_loki
    restart: always
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - backend_net
      - frontend_net

  promtail:
    image: grafana/promtail:2.8.4
    container_name: attendance_promtail
    restart: always
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - backend_net
    depends_on:
      - loki

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true

volumes:
  db_data:

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Docker DNS resolver: Tự động cập nhật IP mới khi container app hoặc phpmyadmin khởi động lại
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hardening: Security Headers bảo vệ ứng dụng
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Khi người dùng vào trang chủ "/" -> Nginx đẩy tới Web App Node.js (cổng 3000)
    location / {
        set $app_upstream http://app:3000;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Khi người dùng vào "/phpmyadmin/" -> Nginx đẩy tới container phpMyAdmin
    location /phpmyadmin/ {
        set $pma_upstream http://phpmyadmin:80;
        rewrite ^/phpmyadmin/(.*)$ /$1 break;
        proxy_pass $pma_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
